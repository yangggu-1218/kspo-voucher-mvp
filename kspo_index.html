<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 공모전 심사용 데모입니다. 일반 검색 유입을 막습니다. -->
<meta name="robots" content="noindex, nofollow">
<title>이번 달 이용권 — 국민체육진흥공단 체육 혜택 찾기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 강좌 찾기 지도 — 카카오맵 JS SDK.
     1) https://developers.kakao.com 에서 무료 애플리케이션 생성
     2) [내 애플리케이션 > 앱 키 > JavaScript 키] 복사
     3) [플랫폼 > Web] 에 배포 도메인(예: https://voucher-demo.example.com) 등록 — 등록 안 하면 지도가 안 뜹니다
     4) 아래 012891db6349c1458bad674953df5233 를 발급받은 키로 교체
     오프라인이거나 키 미설정이면 지도 자리에 안내 문구가 뜨고 목록은 정상 동작합니다(App._mapFallback). -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=012891db6349c1458bad674953df5233&libraries=services" defer></script>
<style>
/* ============================================================
   이번 달 이용권 v2
   - v1 대비: P0 6건 수정 + 소진 설계/이동 가능성/필터 축 추가
   - 지원금액·신청시기 등 사실관계 수치는 CONST 블록 한 곳에 모여 있습니다.
     2026년 공고 원문 확인 후 verified:true 로 바꾸세요.
   ============================================================ */
:root{
  --navy:#0A2A70; --navy-d:#06184A; --navy-soft:#EAEEF7;
  --orange:#FF7F00; --orange-d:#E06E00; --orange-soft:#FFF1E0;
  --ink:#12161F; --ink-2:#3B4354; --muted:#6B7385; --faint:#9AA2B3;
  --line:#E3E6EE; --line-2:#EFF1F6;
  --bg:#FFFFFF; --bg-2:#F6F7FA; --card:#FFFFFF;
  --lost:#C4362B; --lost-soft:#FBEAE7;
  --ok:#1F7A4D; --ok-soft:#E4F2EA;
  --warn:#9A6207; --warn-soft:#FBF0DC;
  --left:#1B6FC9; --left-soft:#E8F1FC;
  --r:10px; --shadow:0 1px 2px rgba(18,22,31,.05), 0 10px 28px -20px rgba(18,22,31,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink); background:var(--bg); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:break-word;
}
a{color:var(--navy);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
ul{margin:0;padding-left:18px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 20px}
.narrow{max-width:760px}

/* ---------- 종목 찾기 ---------- */
.qgroup{padding:14px 0;border-bottom:1px solid var(--line-2)}
.qgroup:first-child{padding-top:0}
.qgroup:last-of-type{border-bottom:0}
.qlabel{font-size:15.5px;font-weight:700;margin-bottom:10px}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.opts3{grid-template-columns:1fr}}
.sport-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px}
@media(max-width:480px){.sport-row{grid-template-columns:1fr}
  .sport-row>div:last-child{text-align:left!important;display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line);padding-top:10px}}
.fitbar{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:8px;max-width:280px}
.fitbar>span{display:block;height:100%;background:var(--navy);border-radius:99px}

/* ---------- 비공식 고지 바 ---------- */
.gov-bar{background:#2B3242;color:#E7EAF2;font-size:12.5px;line-height:1.55;padding:8px 0}
.gov-bar-in{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.gov-bar b{color:#FFC98A;font-weight:700}
.gov-bar button{background:none;border:0;color:#B9C2D6;text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}
.logo-un{padding:2px 7px;border-radius:999px;background:var(--bg-2);color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.02em}

/* ---------- header ---------- */
.hd{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;cursor:pointer}
.logo-mk{width:24px;height:24px;border-radius:7px;flex:none;background:linear-gradient(135deg,var(--navy) 0%,#1B99C4 62%,var(--orange) 62%)}
.logo-tx{font-size:18px;font-weight:800;letter-spacing:-.03em}
.nav{display:flex;gap:2px;margin-left:auto}
.nav button{padding:8px 12px;border:0;background:none;border-radius:8px;font-size:15px;font-weight:600;color:var(--ink-2);cursor:pointer}
.nav button:hover{background:var(--bg-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--navy-soft);color:var(--navy)}
.hd-cta{margin-left:8px}
@media(max-width:760px){
  .hd-in{height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:10px;gap:8px}
  .nav{width:100%;margin-left:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .nav button{white-space:nowrap;font-size:14px}
  .hd .hd-cta{display:none}   /* .btn 보다 뒤에 오도록 특이도 상향 (cascade 충돌 방지) */
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:0;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;transition:background .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-o{background:var(--orange);color:#fff}.btn-o:hover:not(:disabled){background:var(--orange-d)}
.btn-n{background:var(--navy);color:#fff}.btn-n:hover:not(:disabled){background:var(--navy-d)}
.btn-g{background:var(--bg-2);color:var(--ink-2)}.btn-g:hover{background:var(--line-2)}
.btn-ol{background:#fff;color:var(--navy);border:1px solid var(--navy)}.btn-ol:hover{background:var(--navy-soft)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn-blk{width:100%}

/* ---------- generic ---------- */
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.sec{padding:44px 0}
.sec-t{font-size:clamp(22px,3.6vw,30px);font-weight:800;margin-bottom:8px}
.sec-d{color:var(--muted);font-size:15px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-lost{background:var(--lost-soft);color:var(--lost)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-navy{background:var(--navy-soft);color:var(--navy)}
.c-left{background:var(--left-soft);color:var(--left)}
.c-gray{background:var(--bg-2);color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.src{font-size:12px;color:var(--faint)}
.divider{height:1px;background:var(--line);border:0;margin:0}

/* ---------- basis bar ---------- */
.basis{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 16px;background:var(--navy-soft);border-radius:10px;font-size:14px;color:var(--navy);font-weight:600}
.basis .sel{padding:6px 10px;border-radius:8px;border:1px solid #C7D2E8;background:#fff;font-weight:600;color:var(--navy)}

/* ---------- gauge ---------- */
.gauge{display:flex;flex-direction:column;gap:10px}
.gauge-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px}
.gauge-lbl{font-size:14px;color:var(--muted);font-weight:600}
.gauge-val{font-size:22px;font-weight:800;letter-spacing:-.02em}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--line-2)}
.bar>span{display:block;height:100%}
.seg-use{background:var(--navy)}
.seg-add{background:#4C74C0}
.seg-lost{background:repeating-linear-gradient(45deg,var(--lost-soft),var(--lost-soft) 6px,#F4DAD6 6px,#F4DAD6 12px);border-left:2px solid var(--lost)}
.seg-self{background:var(--orange)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- home ---------- */
.hero{padding:56px 0 40px;background:linear-gradient(180deg,#F7F9FD 0%,#FFF 100%);border-bottom:1px solid var(--line)}
.hero-g{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(30px,5.4vw,46px);line-height:1.24;font-weight:800}
.hero .sub{margin-top:14px;font-size:17px;color:var(--ink-2);line-height:1.7}
.hero .acts{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px}
@media(max-width:860px){.hero-g{grid-template-columns:1fr;gap:28px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--navy);transform:translateY(-2px)}
.tile-n{font-size:17px;font-weight:800}
.tile-a{font-size:14px;font-weight:700;color:var(--navy)}
.tile-d{font-size:13.5px;color:var(--muted);line-height:1.6}

/* ---------- quiz ---------- */
.quiz{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:44px 20px 72px;background:var(--bg-2)}
.qcard{width:100%;max-width:660px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
@media(max-width:560px){.qcard{padding:20px}}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:700}
.qtop button{border:0;background:none;color:var(--muted);cursor:pointer;font-weight:700;padding:4px 0}
.qtrack{height:5px;background:var(--line-2);border-radius:99px;margin:12px 0 22px;overflow:hidden}
.qfill{height:100%;background:var(--orange);border-radius:99px;transition:width .25s}
.qt{font-size:23px;font-weight:800;line-height:1.4}
.qh{margin-top:8px;color:var(--muted);font-size:14.5px}
.qbody{margin:22px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;padding:14px 16px;border:1.5px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt:hover{border-color:var(--navy)}
.opt.on{border-color:var(--navy);background:var(--navy-soft)}
.opt b{font-size:15.5px;font-weight:700}
.opt span{font-size:13px;color:var(--muted)}
.sel-f{width:100%;min-height:48px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:15.5px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- result ---------- */
.res-g{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding:36px 0 64px}
@media(max-width:900px){.res-g{grid-template-columns:1fr;gap:20px}}
.res-side{border:1px solid var(--line);border-radius:12px;padding:18px;height:fit-content;background:var(--bg-2)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-of-type{border-bottom:0}
.kv b{font-size:14px;font-weight:700}
.kv span{font-size:13px;color:var(--muted)}
.grp-h{display:flex;align-items:center;gap:8px;margin:26px 0 10px}
.grp-h h3{font-size:17px;font-weight:800}
.blist{display:flex;flex-direction:column;gap:10px}
.brow{text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.brow:hover{border-color:var(--navy)}
.brow.dim{background:var(--bg-2);opacity:.75;cursor:default}
.brow h4{font-size:16.5px;font-weight:800;margin:0}
.brow .m{font-size:13.5px;color:var(--muted);margin-top:3px}
.brow .amt{font-size:15px;font-weight:800;color:var(--navy);white-space:nowrap}

/* ---------- courses ---------- */
.p3top{background:var(--navy);color:#fff;padding:30px 0}
.p3top h1{font-size:clamp(24px,4vw,34px);font-weight:800}
.p3top p{margin-top:8px;color:#C9D6EE;font-size:15px}
.p3g{display:grid;grid-template-columns:264px minmax(0,1fr);gap:26px;padding:24px 0 72px}
@media(max-width:960px){.p3g{grid-template-columns:1fr}}
.filters{display:flex;flex-direction:column;gap:18px;height:fit-content}
@media(max-width:960px){
  .filters{position:fixed;inset:auto 0 0 0;z-index:70;background:#fff;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;padding:16px 20px 20px;max-height:76vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.16);display:none}
  .filters.open{display:flex}
  .fbar{position:sticky;bottom:0;z-index:65;display:flex;gap:8px;padding:10px 0}
}
@media(min-width:961px){.fbar{display:none}}
.fgrp{display:flex;flex-direction:column;gap:8px}
.flbl{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.checks{display:flex;flex-direction:column;gap:2px}
.chk{display:flex;align-items:center;gap:9px;padding:6px 4px;border:0;background:none;cursor:pointer;text-align:left;border-radius:6px;font-size:14.5px;color:var(--ink-2)}
.chk:hover{background:var(--bg-2)}
.box{width:17px;height:17px;border:1.5px solid #C3C9D6;border-radius:5px;flex:none;position:relative;background:#fff}
.chk.on .box{background:var(--navy);border-color:var(--navy)}
.chk.on .box::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
.chk.on{color:var(--ink);font-weight:600}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{padding:8px 0;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.day.on{background:var(--navy);border-color:var(--navy);color:#fff}
.vchips{display:flex;flex-direction:column;gap:5px}
.vchip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.vchip:hover{background:var(--bg-2)}
.vchip b{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.vchip.on{border-width:1.5px;font-weight:700;color:var(--ink)}
.vchip.on.ok{border-color:var(--ok);background:var(--ok-soft)}
.vchip.on.left{border-color:var(--left);background:var(--left-soft)}
.vchip.on.pay{border-color:var(--lost);background:var(--lost-soft)}
.vchip.on.all{border-color:var(--navy);background:var(--navy-soft)}
.tin{width:100%;min-height:42px;padding:0 12px;border:1.5px solid var(--line);border-radius:9px;font-size:14.5px}
.rng{width:100%}

.lhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.lcount{font-size:14.5px;color:var(--ink-2);font-weight:600}
.actchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.actchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--navy-soft);color:var(--navy);font-size:12.5px;font-weight:700;border:0;cursor:pointer}
.actchip:hover{background:#DCE4F5}

.clist{display:flex;flex-direction:column;gap:8px}
.crow{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px;cursor:pointer;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.crow:hover{border-color:var(--navy)}
.crow.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft)}
.crow.picked{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft)}
.crow.v-ok{border-left:6px solid var(--ok)}
.crow.v-left{border-left:6px solid var(--left)}
.crow.v-pay{border-left:6px solid var(--lost)}
.crow.v-none{border-left:6px solid var(--line)}

/* ---------- 강좌 찾기: 지도 ---------- */
.viewtabs{display:flex;gap:4px;background:var(--bg-2);border-radius:10px;padding:3px}
.viewtab{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.viewtab.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.geobar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;background:var(--bg-2);border-radius:10px;margin-bottom:12px}
.geobar .sel-f{width:auto;min-height:36px;font-size:13.5px;padding:0 8px}
.mapwrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg-2)}
#courseMap{width:100%;height:440px}
@media(max-width:640px){#courseMap{height:300px}}
.mapfallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--bg-2);color:var(--muted);font-size:14px;text-align:center;padding:20px}
.maplegend{display:flex;flex-wrap:wrap;gap:12px;padding:10px 14px;font-size:12.5px;color:var(--muted)}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.miniclist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.minirow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;text-align:left}
.minirow:hover{border-color:var(--navy)}
.minirow.hi{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft)}
.minirow .dot{width:10px;height:10px;border-radius:50%;flex:none}
.minirow .dot.ok{background:var(--ok)}.minirow .dot.left{background:var(--left)}.minirow .dot.pay{background:var(--lost)}.minirow .dot.none{background:var(--faint)}
.minirow .nm{font-size:14.5px;font-weight:700;flex:1;min-width:0}
.minirow .dist{font-size:12.5px;color:var(--muted);white-space:nowrap}
.nogeo{font-size:12.5px;color:var(--faint);margin-top:10px}
.cname{font-size:16px;font-weight:800}
.cmeta{font-size:13px;color:var(--muted);margin-top:3px}
.cbadges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cmoney{text-align:right;white-space:nowrap}
.cmoney .k{font-size:11.5px;color:var(--muted);font-weight:700}
.cmoney .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
.cmoney .s{font-size:12px;color:var(--muted);margin-top:2px}
.na{color:var(--faint)!important}
@media(max-width:520px){
  .crow{grid-template-columns:1fr}

.combo{border:1px solid var(--line);border-radius:12px;padding:16px;background:linear-gradient(180deg,#FFF9F2 0%,#FFF 100%);margin-bottom:16px}
.combo h3{font-size:16px;font-weight:800;margin-bottom:2px}
.combo-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.combo-item{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:9px}
.combo-item .nm{font-size:14.5px;font-weight:700}
.combo-item .dt{font-size:12.5px;color:var(--muted)}

.panel{border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff;margin-top:12px}
.rounds{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rrow{display:flex;justify-content:space-between;padding:9px 13px;border-bottom:1px solid var(--line-2);font-size:14px}
.rrow:last-child{border-bottom:0}
.rtot{display:flex;justify-content:space-between;padding:11px 13px;background:var(--bg-2);font-weight:800}

.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;background:var(--bg-2)}
.empty h3{font-size:18px;font-weight:800;margin-bottom:6px}

/* ---------- records ---------- */
.p4g{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;padding:34px 0 72px}
@media(max-width:900px){.p4g{grid-template-columns:1fr}}
.rec{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:8px}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-2)}
.tgl.on{background:var(--ok-soft);border-color:#BFDDCC;color:var(--ok)}
.dl{border-left:3px solid var(--line);padding:10px 0 10px 12px;margin-bottom:10px}
.dl .d{font-size:13px;font-weight:700;color:var(--muted)}
.dl .t{font-size:15px;font-weight:800;margin-top:2px}
.dl .a{font-size:13.5px;color:var(--muted)}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
th{background:var(--bg-2);font-weight:800;font-size:12.5px;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(10,16,30,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.mod{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:86vh;overflow:auto;padding:26px}
@media(max-width:560px){.mod{padding:20px}}
.mod-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.icb{border:0;background:var(--bg-2);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px;color:var(--muted);flex:none}
.icb:hover{background:var(--line-2)}
.facts{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.fact .k{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.fact .v{font-size:15px;color:var(--ink-2);margin-top:2px}

/* ---------- footer / toast ---------- */
.ft{margin-top:auto;border-top:1px solid var(--line);background:var(--bg-2);padding:22px 0}
.ft-in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.ft p{font-size:13px;color:var(--muted);max-width:720px}
.lnk{border:0;background:none;color:var(--faint);font-size:12px;cursor:pointer;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:200;box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

function sportFit(t,p){
  var s=0, max=0;
  function add(w,v){ s+=w*v; max+=w; }
  if(p.together==="혼자") add(2,t.solo); else if(p.together==="여럿") add(2,1-t.solo);
  if(p.contact==="괜찮아") add(1.2,t.contact); else if(p.contact==="싫어") add(2,1-t.contact);
  if(p.place==="실내") add(1.5,t.indoor); else if(p.place==="실외") add(1.5,1-t.indoor);
  if(p.music==="좋아") add(2,t.music); else if(p.music==="별로") add(.8,1-t.music);
  if(p.water==="좋아") add(2.5,t.water); else if(p.water==="별로") add(.8,1-t.water);
  if(max===0) return null;
  return Math.round(s/max*100);
}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){

}

function resolveTier(a){
  if(a.tierOverride){
    for(var i=0;i<SUPPORT.tiers.length;i++) if(SUPPORT.tiers[i].id===a.tierOverride) return SUPPORT.tiers[i];
  }
  if(a.disability==="있음") return SUPPORT.tiers[2];
  if(!a.birthYear) return null;
  var age=ageOf(a.birthYear);
  if(age>=5&&age<=12) return SUPPORT.tiers[0];
  if(age>=13&&age<=18) return SUPPORT.tiers[1];
  return null;
}

/* 자부담 / 소멸액 (다개월 게이지·조합 추천용) */
function estimate(fee, limit, months){
  if(fee==null||limit==null) return {calculable:false,self:null,used:null,lost:null};
  return {
    calculable:true,
    self: Math.max(0,fee-limit)*months,
    used: Math.min(fee,limit)*months,
    lost: Math.max(0,limit-fee)*months
  };
}

/* v3 핵심 — 강좌 1건의 월 단위 3색 판정. 목록·상세 표시는 전부 이 함수를 거칩니다.
   ok(초록·추가부담없음) / left(파랑·지원금 남음) / pay(빨강·자부담 발생) / none(한도 미확정) */
function verdict(price, L){
  if(price==null) return {k:"unpriced"};
  if(L==null)      return {k:"none"};
  if(price > L)    return {k:"pay",  self:price-L, label:"매달 "+won(price-L)+" 더"};
  if(price < L)    return {k:"left", left:L-price, label:won(L-price)+" 남아요"};
  return {k:"ok", label:"추가 부담 없음"};
}
/* 같은 지역(code) · 같은 종목 안에서 이 강좌가 가격 오름차순 몇 번째인지.
   전국 가격 범위(G 데이터셋)는 실데이터 연동 전까지 표시하지 않습니다 — 없는 수치를 지어내지 않기 위함. */
function priceRankInRegion(course, allCourses){
  var peers=allCourses.filter(function(c){
    return c.code===course.code && c.sport===course.sport && c.fee!=null;
  }).sort(function(a,b){ return a.fee-b.fee; });
  var rank=-1;
  for(var i=0;i<peers.length;i++) if(peers[i].id===course.id){ rank=i+1; break; }
  return { rank:rank, total:peers.length };
}

/* v3(수정) — 도보·셔틀 "혼자 갈 수 있어요" 판정은 여전히 범위 제외입니다(요일·시간 데이터 없음).
   다만 위치 지도는 좌표가 확인된 강좌에 한해 제한적으로 제공합니다.
   실데이터 353건 중 주소→좌표 변환 성공률은 29.3%로 낮아, 좌표 없는 강좌는 지도에 표시하지 않고
   목록에만 "위치 정보 없음" 배지로 노출합니다. 강좌 상세의 「이동」 항목도 이 한계를 그대로 안내합니다. */
function haversineM(a,b){
  var R=6371000, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  var la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.sin(dLng/2)*Math.sin(dLng/2)*Math.cos(la1)*Math.cos(la2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}

/* 조합 추천 — 한도 이하에서 합계 최대화, 요일 충돌 제외 */
function dayConflict(a,b){
  if(a.flexible||b.flexible) return false;   /* 종일 자유이용은 충돌로 보지 않음 */
  for(var i=0;i<a.days.length;i++) if(b.days.indexOf(a.days[i])>=0) return true;
  return false;
}
function bestCombos(list, limit, opts){
  opts=opts||{};
  var pool=list.filter(function(c){ return c.fee!=null && c.fee<=limit; });
  pool=pool.slice(0,24);
  var found=[];
  function dfs(start, picked, total){
    if(picked.length>=1) found.push({items:picked.slice(),total:total});
    if(picked.length>=3) return;
    for(var i=start;i<pool.length;i++){
      var c=pool[i];
      if(total+c.fee>limit) continue;
      var ok=true;
      for(var k=0;k<picked.length;k++) if(dayConflict(picked[k],c)){ ok=false; break; }
      if(!ok) continue;
      picked.push(c); dfs(i+1,picked,total+c.fee); picked.pop();
    }
  }
  dfs(0,[],0);
  found.sort(function(x,y){
    if(y.total!==x.total) return y.total-x.total;
    return x.items.length-y.items.length;
  });
  var seen={}, out=[];
  for(var i=0;i<found.length && out.length<3;i++){
    var key=found[i].items.map(function(c){return c.id;}).sort().join("|");
    if(seen[key]) continue; seen[key]=1;
    if(found[i].items.length<2 && out.length>0) continue;   /* 2개 이상 조합 우선 */
    out.push(found[i]);
  }
  return out;
}

  pref:{ together:"", contact:"", place:"", music:"", water:"" },
  demand:[]
};

function persist(){
  try{
    localStorage.setItem(STORE, JSON.stringify({
      answers:state.answers, rec:state.rec, f:state.f,
      pref:state.pref, demand:state.demand
    }));
  }catch(e){}
}
function restore(){
  try{
    var raw=localStorage.getItem(STORE); if(!raw) return;
    var d=JSON.parse(raw);
    if(d.answers) state.answers=Object.assign(state.answers,d.answers);
    if(d.rec) state.rec=d.rec;
    if(d.f) state.f=Object.assign(state.f,d.f);
    if(d.pref) state.pref=Object.assign(state.pref,d.pref);
    if(Array.isArray(d.demand)) state.demand=d.demand;
  }catch(e){}
}
function readQuery(){
  try{
    var p=new URLSearchParams(location.search);
    if(p.get("region")) state.f.code=p.get("region");
    if(p.get("sports")) state.f.sports=p.get("sports").split(",").filter(Boolean);
    if(p.get("days")) state.f.days=p.get("days").split(",").filter(Boolean);
    if(p.get("months")) state.f.months=Number(p.get("months"))||1;
    if(p.get("verdict")) state.f.verdict=p.get("verdict");
    if(p.get("view")==="courses") state.route="courses";
  }catch(e){}
}
function shareUrl(){
  var f=state.f, p=[];
  p.push("view=courses"); p.push("region="+encodeURIComponent(f.code));
  if(f.sports.length) p.push("sports="+encodeURIComponent(f.sports.join(",")));
  if(f.days.length) p.push("days="+encodeURIComponent(f.days.join(",")));
  if(f.months!==1) p.push("months="+f.months);
  if(f.verdict) p.push("verdict="+f.verdict);
  return location.origin+location.pathname+"?"+p.join("&");
}

function courseView(){
  var a=state.answers, f=state.f;
  var limit=monthlyLimit(a);
  var regionScoped=COURSES.filter(function(c){ return f.code==="all"||c.code===f.code; });
  var list=regionScoped.filter(function(c){
    if(f.sports.length && f.sports.indexOf(c.sport)<0) return false;
    if(f.days.length && !c.days.some(function(d){return f.days.indexOf(d)>=0;})) return false;
    if(f.slots.length && f.slots.indexOf(c.slot)<0) return false;
    if(f.q){
      var q=f.q.trim();
      if(q && (c.facility+" "+c.name+" "+c.sport).indexOf(q)<0) return false;
    }
    return true;
  }).map(function(c){
    var o=Object.assign({},c);
    o._est=estimate(c.fee,limit,f.months);          /* 게이지·조합 추천용 (다개월) */
    o._verdict=verdict(c.fee,limit);                 /* v3 핵심 — 월 단위 3색 판정 */
    o._rank=priceRankInRegion(c,regionScoped);
    o._geo = (c.lat!=null && c.lng!=null);            /* 좌표 확인 여부 — 지도엔 이것만 표시 */
    o._dist = (state.geo && o._geo) ? haversineM(state.geo,{lat:c.lat,lng:c.lng}) : null;
    return o;
  });

  var counts={all:0,ok:0,left:0,pay:0};
  list.forEach(function(c){
    if(c._verdict.k==="ok"||c._verdict.k==="left"||c._verdict.k==="pay"){ counts.all++; counts[c._verdict.k]++; }
  });

  if(f.verdict) list=list.filter(function(c){ return c._verdict.k===f.verdict; });
  /* 지도 모드 + 내 위치 설정 시에만 반경으로 좁힘 (좌표 없는 강좌는 반경 판정 불가 → 제외) */
  if(f.mapMode && state.geo && f.radius) list=list.filter(function(c){ return c._dist!=null && c._dist<=f.radius; });

  var priced=list.filter(function(c){return c.fee!=null;});
  var unpriced=list.filter(function(c){return c.fee==null;});

  priced.sort(function(x,y){
    if(f.sort==="fee_desc") return y.fee-x.fee;
    return x.fee-y.fee;   /* 기본값: 가격 낮은 순 */
  });
  return { limit:limit, priced:priced, unpriced:unpriced, all:priced.concat(unpriced), counts:counts };
}

function pickedCourses(){
  return state.picked.map(function(id){
    for(var i=0;i<COURSES.length;i++) if(COURSES[i].id===id) return COURSES[i];
    return null;
  }).filter(Boolean);
}
function pickedTotal(){ return pickedCourses().reduce(function(s,c){return s+(c.fee||0);},0); }

var App={
  go:function(r){ state.route=r; state.modal=null; state.filtersOpen=false; render(); window.scrollTo(0,0); },
  toast:function(m){
    state.toast=m; render();
    clearTimeout(App._t); App._t=setTimeout(function(){ state.toast=null; render(); },2000);
  },
  stop:function(e){ e.stopPropagation(); },

  /* 진단 */
  answer:function(k,v){ state.answers[k]=v; persist(); render(); },
  next:function(){
    var qs=questions();
    if(!qs[state.step].ready) return;
    if(state.step===qs.length-1){
      if(state.answers.code) state.f.code=state.answers.code;   /* CHG-03 지역 승계 */
      state.route="result"; persist(); render(); window.scrollTo(0,0); return;
    }
    state.step++; render();
  },
  prev:function(){ state.step=Math.max(0,state.step-1); render(); },
  restart:function(){ state.route="quiz"; state.step=0; render(); window.scrollTo(0,0); },

  openBenefit:function(id){ state.modal=id; render(); },
  closeModal:function(){ state.modal=null; render(); },
  deepDive:function(){ state.modal=null; state.route="courses"; render(); window.scrollTo(0,0); },

  /* 기준 직접 선택 (미진단 사용자) */
  setTier:function(v){ state.answers.tierOverride=v; persist(); render(); },

  /* 필터 */
  setRegion:function(v){ state.f.code=v; state.detailId=null; state.picked=[]; persist(); render(); },
  setMonths:function(v){ state.f.months=Number(v); persist(); render(); },
  setSort:function(v){ state.f.sort=v; render(); },
  setVerdictFilter:function(v){ state.f.verdict=(state.f.verdict===v?"":v); persist(); render(); },
  setQuery:function(v){ state.f.q=v; render(); },
  toggleArr:function(key,v){
    var arr=state.f[key], i=arr.indexOf(v);
    if(i>=0) arr.splice(i,1); else arr.push(v);
    persist(); render();
  },
  toggleFlag:function(key){ state.f[key]=!state.f[key]; persist(); render(); },
  clearFilters:function(){
    state.f.sports=[];state.f.days=[];state.f.slots=[];state.f.verdict="";state.f.q="";persist();render();
  },
  toggleFilters:function(){ state.filtersOpen=!state.filtersOpen; render(); },

  /* 지도 (CHG-16) — 반경 검색은 좌표 확인된 강좌에 한해 동작, 위치정보는 저장·전송하지 않음 */
  setMapMode:function(v){
    state.f.mapMode=!!v; persist();
    if(v && !state.geo && state.geoState==="idle") App.useGeo();
    render();
  },
  useGeo:function(){
    if(!navigator.geolocation){ state.geoState="error"; render(); return; }
    state.geoState="loading"; render();
    navigator.geolocation.getCurrentPosition(function(pos){
      state.geo={lat:pos.coords.latitude,lng:pos.coords.longitude};
      state.geoState="ok"; render();
    },function(){
      state.geoState="error"; render();
    },{enableHighAccuracy:false,timeout:8000,maximumAge:60000});
  },
  clearGeo:function(){ state.geo=null; state.geoState="idle"; state.geoHi=null; render(); },
  setRadius:function(v){ state.f.radius=Number(v); persist(); render(); },
  hiCourse:function(id){ state.geoHi=id; render(); },
  copyLink:function(){
    var u=shareUrl();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(u).then(function(){App.toast("링크를 복사했어요");},function(){App.toast(u);});
    } else App.toast(u);
  },

  /* 강좌 */
  openDetail:function(id){ state.detailId=(state.detailId===id?null:id); render(); },
  closeDetail:function(){ state.detailId=null; render(); },
  togglePick:function(id,e){
    if(e) e.stopPropagation();
    var i=state.picked.indexOf(id);
    if(i>=0) state.picked.splice(i,1); else state.picked.push(id);
    render();
  },
  applyCombo:function(ids){ state.picked=ids.slice(); App.toast("조합을 담았어요"); },
  clearPicks:function(){ state.picked=[]; render(); },

  /* 종목 찾기 */
  setPref:function(k,v){ state.pref[k]=v; persist(); render(); },
  resetPref:function(){ state.pref={together:"",contact:"",place:"",music:"",water:""}; persist(); render(); },
  addDemand:function(sp){
    if(state.demand.indexOf(sp)<0) state.demand.push(sp);
    persist(); App.toast(sp+" 요청을 남겼어요");
  },
  seeSport:function(sp){
    state.f.sports=[sp]; state.route="courses"; persist(); render(); window.scrollTo(0,0);
  },

  /* 기록 — BUG-05 */
  register:function(id){
    if(!state.rec[id]) state.rec[id]={pay:false,att:false,addedAt:new Date().toISOString()};
    persist(); App.toast("내 기록에 담았어요");
    state.route="records"; render(); window.scrollTo(0,0);
  },
  registerPicked:function(){
    var ids=state.picked.slice();
    if(!ids.length) return;
    ids.forEach(function(id){ if(!state.rec[id]) state.rec[id]={pay:false,att:false,addedAt:new Date().toISOString()}; });
    persist(); App.toast(ids.length+"개 강좌를 담았어요");
    state.route="records"; render(); window.scrollTo(0,0);
  },
  toggleRec:function(id,k){
    if(!state.rec[id]) return;
    state.rec[id][k]=!state.rec[id][k]; persist(); render();
  },
  removeRec:function(id){ delete state.rec[id]; persist(); render(); },
  demoRec:function(){
    ["i1","i3"].forEach(function(id){ state.rec[id]={pay:false,att:false,addedAt:new Date().toISOString()}; });
    persist(); App.toast("예시 데이터를 넣었어요"); render();
  }
};

function gaugeHTML(limit, useAmt, opts){
  opts=opts||{};
  if(limit==null) return "";
  var used=Math.min(useAmt,limit), over=Math.max(0,useAmt-limit), lost=Math.max(0,limit-useAmt);
  var total=limit+over;
  var pUsed=used/total*100, pLost=lost/total*100, pOver=over/total*100;
  var lines=[];
  if(lost>0) lines.push('<span class="chip c-lost">'+won(lost)+' 소멸 예정</span>');
  else lines.push('<span class="chip c-ok">소멸 0원</span>');
  if(over>0) lines.push('<span class="chip c-warn">자부담 '+won(over)+'</span>');
  else lines.push('<span class="chip c-ok">자부담 0원</span>');

  return '<div class="gauge">'+
    '<div class="gauge-top">'+
      '<span class="gauge-lbl">'+esc(opts.label||"이번 달 지원금")+' <b class="mono">'+won(limit)+'</b></span>'+
      '<span class="gauge-val mono" style="color:'+(lost>0?"var(--lost)":"var(--ok)")+'">'+
        (lost>0? won(lost)+" 소멸" : "남김없이 사용")+'</span>'+
    '</div>'+
    '<div class="bar" role="img" aria-label="지원금 '+won(limit)+' 중 '+won(used)+' 사용, '+won(lost)+' 소멸 예정">'+
      '<span class="seg-use" style="width:'+pUsed+'%"></span>'+
      (lost>0?'<span class="seg-lost" style="width:'+pLost+'%"></span>':'')+
      (over>0?'<span class="seg-self" style="width:'+pOver+'%"></span>':'')+
    '</div>'+
    '<div class="legend">'+lines.join("")+
      '<span><i style="background:var(--navy)"></i>사용</span>'+
      '<span><i style="background:#F4DAD6;border:1px solid var(--lost)"></i>소멸</span>'+
      (over>0?'<span><i style="background:var(--orange)"></i>자부담</span>':'')+
    '</div>'+
    (lost>0? '<p class="note">이 상태가 이어지면 <b class="mono" style="color:var(--lost)">'+won(lost*12)+'</b>이 1년 동안 사라져요. 지원금은 다음 달로 이월되지 않아요.</p>':'')+
  '</div>';
}

  return '<main class="quiz"><div class="qcard">'+
    '<div class="qtop">'+
      (state.step>0?'<button type="button" onclick="App.prev()">← 이전</button>':'<span></span>')+

      '<button type="button" class="btn '+(q.ready?'btn-o':'btn-g')+'" onclick="App.next()"'+(q.ready?'':' disabled')+'>'+
        (state.step===qs.length-1?'결과 보기':'다음')+'</button>'+
    '</div>'+
  '</div></main>';
}

/* ---------- result ---------- */
function resultHTML(){
  var a=state.answers, list=judged();
  var g={eligible:[],unknown:[],ineligible:[]};
  list.forEach(function(x){ g[x.level].push(x); });

  var tier=resolveTier(a);
  var summary=[
    ["출생연도", a.birthYear? a.birthYear+"년생 (만 "+ageOf(a.birthYear)+"세)":"—"],
    ["지원 구분", a.grade||"—"],
    ["장애 등록", a.disability||"—"],
    ["지역", a.code? regionLabel(a.code):"—"],
    ["적용 한도", tier? tier.label+" · 월 "+won(tier.limit):"확인 필요"]
  ].map(function(r){ return '<div class="kv"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>'; }).join("");

  function row(x,dim){
    var b=x.b;
    var right = dim? '<span class="chip c-gray">해당 없음</span>'
                   : '<span class="amt">'+esc(b.amount)+'</span>';
    return '<button type="button" class="brow'+(dim?' dim':'')+'"'+
      (dim?'':' onclick="App.openBenefit('+j(b.id)+')"')+'>'+
      '<span><h4>'+esc(b.name)+'</h4>'+
        '<span class="m">'+esc(x.reason||b.short)+'</span>'+
        '<span class="m" style="display:block">'+esc(b.period.label)+(b.period.window?' · '+esc(b.period.window):'')+'</span>'+
      '</span>'+right+'</button>';
  }

  var out='';
  if(g.eligible.length){
    out+='<div class="grp-h"><span class="chip c-ok">받을 수 있어요</span><h3>'+g.eligible.length+'건</h3></div>'+
      '<div class="blist">'+g.eligible.map(function(x){return row(x,false);}).join("")+'</div>';
  }
  if(g.unknown.length){
    out+='<div class="grp-h"><span class="chip c-warn">확인이 필요해요</span><h3>'+g.unknown.length+'건</h3></div>'+
      '<div class="blist">'+g.unknown.map(function(x){return row(x,false);}).join("")+'</div>';
  }
  if(g.ineligible.length){
    out+='<div class="grp-h"><span class="chip c-gray">해당하지 않아요</span><h3>'+g.ineligible.length+'건</h3></div>'+
      '<div class="blist">'+g.ineligible.map(function(x){return row(x,true);}).join("")+'</div>';
  }

  var svo=null; g.eligible.forEach(function(x){ if(x.b.id==="svoucher") svo=x; });

  /* 중복수혜 — 공식 사이트가 답하지 않는 질문 */
  var cand=g.eligible.concat(g.unknown);
  var comboHTML="";
  if(cand.length>=2){
    var pairs=[];
    for(var i=0;i<cand.length;i++) for(var k=i+1;k<cand.length;k++){
      var r=comboRule(cand[i].b.id,cand[k].b.id);
      pairs.push({a:cand[i].b,b:cand[k].b,r:r});
    }
    var order={choose:0,unknown:1,together:2};
    pairs.sort(function(x,y){ return order[x.r.status]-order[y.r.status]; });
    var n={choose:0,unknown:0,together:0};
    pairs.forEach(function(p){ n[p.r.status]++; });

    comboHTML='<div class="card" style="padding:18px;margin:26px 0 6px">'+
      '<span class="eyebrow">중복수혜</span>'+
      '<h3 style="font-size:19px;font-weight:800;margin:6px 0 4px">이 혜택들, 같이 받을 수 있을까요?</h3>'+
      '<p class="note">각 사업 사이트는 자기 사업만 안내해요. 조합해서 받을 수 있는지는 한곳에서 확인해야 알 수 있어요.</p>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:12px 0">'+
        (n.together?'<span class="chip c-ok">함께 가능 '+n.together+'</span>':'')+
        (n.choose?'<span class="chip c-warn">선택 필요 '+n.choose+'</span>':'')+
        (n.unknown?'<span class="chip c-gray">확인 필요 '+n.unknown+'</span>':'')+
      '</div>'+
      '<div class="clist">'+pairs.map(function(p){
        var cmp="";
        if(p.r.status==="choose"){
          cmp='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">'+
            '<span class="chip c-navy">'+esc(p.a.name)+' '+esc(p.a.amount)+'</span>'+
            '<span class="chip c-navy">'+esc(p.b.name)+' '+esc(p.b.amount)+'</span>'+
          '</div>';
        }
        return '<div style="border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:#fff">'+
          '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center">'+
            '<b style="font-size:14.5px">'+esc(p.a.name)+' + '+esc(p.b.name)+'</b>'+
            '<span class="chip '+COMBO_CHIP[p.r.status]+'">'+COMBO_LABEL[p.r.status]+'</span>'+
          '</div>'+
          '<p class="note" style="margin-top:6px">'+esc(p.r.basis)+'</p>'+cmp+
          (p.r.todo?'<p class="src" style="margin-top:6px">확인할 것 — '+esc(p.r.todo)+'</p>':'')+
        '</div>';
      }).join("")+'</div>'+
      '<p class="src" style="margin-top:12px">중복수혜 규칙은 각 사업 공고에 흩어져 있어 통합 공개 자료가 없어요. '+
      '지금 판정은 <b>공고 원문 검증 전</b>이며, 문화누리카드 등 타 부처 바우처와의 관계도 확인 대상이에요.</p>'+
    '</div>';
  }

  return '<main class="wrap"><div class="res-g">'+
    '<aside class="res-side">'+
      '<span class="eyebrow">내 답변</span><div style="margin-top:8px">'+summary+'</div>'+
      '<button type="button" class="btn btn-g btn-sm btn-blk" style="margin-top:12px" onclick="App.restart()">다시 진단하기</button>'+
    '</aside>'+
    '<section>'+
      '<h1 class="sec-t">진단 결과</h1>'+
      '<p class="sec-d">확실한 것과 확인이 필요한 것을 나눠서 보여드려요. 기준일 <span class="mono">'+TODAY+'</span></p>'+
      (svo? '<div class="card" style="padding:18px;margin-bottom:8px;border-color:var(--orange)">'+
        '<span class="eyebrow" style="color:var(--orange-d)">가장 큰 혜택</span>'+
        '<h3 style="font-size:19px;font-weight:800;margin:6px 0 4px">스포츠강좌이용권을 받을 수 있어요</h3>'+
        '<p class="note">'+(tier?esc(tier.label)+' 기준 월 <b class="mono">'+won(tier.limit)+'</b>':'')+' — 이 금액을 남김없이 쓰는 방법을 찾아드릴게요.</p>'+
        '<button type="button" class="btn btn-o btn-sm" style="margin-top:12px" onclick="App.go(\'courses\')">내 지역 강좌 보러가기</button>'+
      '</div>':'')+
      out+
      comboHTML+
      '<p class="note" style="margin-top:20px">참고용 안내예요. 최종 자격은 각 사업 운영기관에서 확인해주세요.</p>'+
    '</section>'+
  '</div></main>';
}

/* ---------- 종목 찾기 (아이 선호 매칭) ---------- */
function matchHTML(){
  var p=state.pref;
  var answered=PREF_Q.filter(function(q){return !!p[q.key];}).length;

  var qs=PREF_Q.map(function(q){
    return '<div class="qgroup">'+
      '<p class="qlabel">'+esc(q.q)+'</p>'+
      '<div class="opts3">'+q.opts.map(function(o){
        var on=p[q.key]===o[0];
        return '<button type="button" class="opt'+(on?' on':'')+'" onclick="App.setPref('+j(q.key)+','+j(o[0])+')" aria-pressed="'+on+'">'+
          '<b>'+esc(o[0])+'</b><span>'+esc(o[1])+'</span></button>';
      }).join("")+'</div></div>';
  }).join("");

  var body="";
  if(answered<PREF_Q.length){
    body='<div class="empty" style="margin-top:24px"><h3>'+answered+' / '+PREF_Q.length+'개 답했어요</h3>'+
      '<p class="note">다 답하면 성향에 맞는 종목을 찾아드릴게요.</p></div>';
  } else {
    var region=state.f.code;
    var here={}; COURSES.forEach(function(c){ if(region==="all"||c.code===region) here[c.sport]=true; });

    var ranked=SPORT_TRAITS.map(function(t){
      return { t:t, fit:sportFit(t,p), has:!!here[t.n] };
    }).sort(function(a,b){ return b.fit-a.fit; });

    var top=ranked.slice(0,8);
    var avail=top.filter(function(x){return x.has;});
    var none=top.filter(function(x){return !x.has;});

    function row(x){
      return '<div class="sport-row">'+
        '<div style="min-width:0">'+
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
            '<b style="font-size:15.5px">'+esc(x.t.n)+'</b>'+
            (x.has?'<span class="chip c-ok">우리 동네에 있어요</span>':'<span class="chip c-gray">이 지역엔 없어요</span>')+
          '</div>'+
          '<p class="note" style="margin-top:3px">'+esc(x.t.d)+'</p>'+
          '<div class="fitbar" aria-hidden="true"><span style="width:'+x.fit+'%"></span></div>'+
        '</div>'+
        '<div style="text-align:right;white-space:nowrap">'+
          '<div class="mono" style="font-size:18px;font-weight:800;color:var(--navy)">'+x.fit+'%</div>'+
          '<div class="src">성향 일치</div>'+
          (x.has
            ? '<button type="button" class="btn btn-ol btn-sm" style="margin-top:8px" onclick="App.seeSport('+j(x.t.n)+')">강좌 보기</button>'
            : '<button type="button" class="btn btn-g btn-sm" style="margin-top:8px" onclick="App.addDemand('+j(x.t.n)+')">'+
              (state.demand.indexOf(x.t.n)>=0?'요청함 ✓':'있으면 좋겠어요')+'</button>')+
        '</div>'+
      '</div>';
    }

    body='<div style="margin-top:26px">'+
      '<div class="grp-h" style="margin-top:0"><span class="chip c-ok">'+esc(regionLabel(region))+'에 있어요</span><h3>'+avail.length+'개 종목</h3></div>'+
      (avail.length? '<div class="clist">'+avail.map(row).join("")+'</div>'
        : '<div class="empty"><h3>성향에 맞는 종목이 이 지역엔 없어요</h3>'+
          '<p class="note">아래에서 «있으면 좋겠어요»를 눌러 요청을 남겨주세요.</p></div>')+
      (none.length? '<div class="grp-h"><span class="chip c-gray">이 지역엔 없어요</span><h3>'+none.length+'개 종목</h3></div>'+
        '<p class="note" style="margin:-6px 0 10px">요청을 남기면 «어느 지역에 어떤 종목이 필요한지» 집계에 쌓여요. '+
        '이름이나 연락처는 받지 않아요.</p>'+
        '<div class="clist">'+none.map(row).join("")+'</div>':'')+
      (state.demand.length? '<p class="note" style="margin-top:12px">지금까지 남긴 요청 — <b>'+state.demand.map(esc).join(", ")+'</b></p>':'')+
    '</div>'+

    '<div class="card" style="padding:18px;margin-top:26px;border-color:var(--ok)">'+
      '<span class="eyebrow" style="color:var(--ok)">국민체력100</span>'+
      '<h3 style="font-size:18px;font-weight:800;margin:6px 0 4px">"우리 아이한테 어떤 운동이 맞을까요?"</h3>'+
      '<p class="note">여기서는 <b>어떻게 하는 운동인지</b>만 알려드려요. 체력에 맞는 운동을 알고 싶다면 '+
      '국민체력100에서 <b>무료 체력측정</b>을 받고 운동처방사의 상담을 받을 수 있어요. '+
      '그 결과를 가지고 다시 오시면 종목으로 강좌를 찾아드릴게요.</p>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+
        '<button type="button" class="btn btn-ol btn-sm" onclick="App.openBenefit(\'nfa\')">국민체력100 알아보기</button>'+
        '<button type="button" class="btn btn-g btn-sm" onclick="App.openBenefit(\'online\')">온라인 운동 코칭 알아보기</button>'+
      '</div>'+
    '</div>';
  }

  return '<main class="wrap sec narrow">'+
    '<span class="eyebrow">아이에게 물어보세요</span>'+
    '<h1 class="sec-t">어떤 운동이 잘 맞을까?</h1>'+
    '<p class="sec-d">정답이 없는 질문이에요. 아이가 직접 골라야 오래 다녀요. '+
    '<b>지역: '+esc(regionLabel(state.f.code))+'</b></p>'+
    '<div class="card" style="padding:20px">'+qs+
      (answered? '<button type="button" class="btn btn-g btn-sm" style="margin-top:6px" onclick="App.resetPref()">다시 고르기</button>':'')+
    '</div>'+
    body+
    '<p class="src" style="margin-top:22px">이 화면은 <b>운동을 하는 방식</b>(혼자·여럿, 실내·실외 등)만 다뤄요. '+
    '키·체중 같은 건강 효과는 다루지 않습니다. 그건 국민체력100의 운동처방 영역이에요.</p>'+
  '</main>';
}

      '<div class="card" style="padding:16px"><ul style="font-size:14.5px;color:var(--ink-2);gap:8px;display:flex;flex-direction:column">'+
      rows.map(function(r){return '<li>'+r+'</li>';}).join("")+'</ul></div>';
  }
  return '<main class="wrap sec narrow">'+
    '<span class="eyebrow">Privacy</span>'+
    '<h1 class="sec-t">개인정보 처리 안내</h1>'+
    '<p class="sec-d">이 서비스는 공모전 출품용 데모입니다. <b>서버가 없고, 어떤 정보도 외부로 전송하지 않습니다.</b></p>'+
    block("수집하지 않는 것",[
      "이름, 생년월일, 주민등록번호, 연락처, 주소를 <b>입력받지 않습니다.</b>",
      "수급 자격 증빙 서류를 받지 않습니다.",
      "회원가입이 없습니다."
    ])+
    block("기기에만 저장되는 것",[
      "진단 답변(출생연도·지원구분·장애 등록 여부·시·군·구)",
      "담아둔 강좌와 결제·출석 체크 표시",
      "필터 설정과 출발지",
      "저장 위치는 <b>브라우저의 localStorage</b>이며, 브라우저 데이터를 지우면 함께 사라집니다."
    ])+
    block("위치 정보",[
      "«현위치로 찾기»를 누른 경우에만 브라우저가 좌표를 제공합니다.",
      "좌표는 <b>화면에서 거리를 계산하는 데만</b> 쓰이고 저장·전송하지 않습니다.",
      "권한을 거부해도 학교·지역 중심 선택으로 모든 기능을 쓸 수 있습니다.",
      "만 14세 미만 이용자는 보호자와 함께 사용해주세요."
    ])+
    block("정확도에 대한 고지",[
      "지원금액·신청시기 등 일부 수치는 <b>공고 원문 검증 전</b>입니다. 검증 상태는 데이터 출처 화면에 그대로 공개합니다.",
      "강좌 목록에는 <b>예시 데이터</b>가 섞여 있으며 카드에 표시됩니다.",
      "거리는 직선거리 기준 추정치입니다.",
      "실제 신청·자격·금액은 반드시 각 사업 공식 채널에서 확인해주세요."
    ])+
    '<p class="note" style="margin-top:20px">문의는 출품팀에게 해주세요. 국민체육진흥공단은 이 서비스와 관련이 없습니다.</p>'+
    '<button type="button" class="btn btn-g btn-sm" style="margin-top:16px" onclick="App.go(\'home\')">← 돌아가기</button>'+
  '</main>';
}

/* ---------- benefit modal ---------- */
function modalHTML(){
  if(!state.modal) return "";
  var b=null; for(var i=0;i<BENEFITS.length;i++) if(BENEFITS[i].id===state.modal) b=BENEFITS[i];
  if(!b) return "";
  var e=b.eligibility(state.answers)||{level:"unknown"};
  var badge = e.level==="eligible" ? '<span class="chip c-ok">받을 수 있어요</span>'
            : e.level==="ineligible" ? '<span class="chip c-gray">해당하지 않아요</span>'
            : '<span class="chip c-warn">확인이 필요해요</span>';

  return '<div class="ov" onclick="App.closeModal()" role="dialog" aria-modal="true" aria-label="'+esc(b.name)+'">'+
    '<div class="mod" onclick="App.stop(event)">'+
      '<div class="mod-h"><div>'+badge+
        '<h2 style="font-size:23px;font-weight:800;margin-top:8px">'+esc(b.name)+'</h2>'+
        '<p style="font-size:17px;font-weight:700;color:var(--navy);margin-top:2px">'+esc(b.amount)+'</p></div>'+
        '<button type="button" class="icb" onclick="App.closeModal()" aria-label="닫기">✕</button></div>'+
      (e.reason?'<p class="note" style="margin-top:6px">'+esc(e.reason)+'</p>':'')+
      (b.parent?'<p class="note" style="margin-top:8px;padding:10px 12px;background:var(--ok-soft);color:var(--ok);border-radius:8px">'+
        '국민체력100 안의 서비스예요. 체력측정을 먼저 하면 이어서 이용할 수 있어요.</p>':'')+
      (b.prereq?'<p class="src" style="margin-top:8px">참여 절차 — '+esc(b.prereq)+'</p>':'')+
      '<div class="facts">'+
        '<div class="fact"><div class="k">지원 내용</div><div class="v">'+esc(b.detail)+'</div></div>'+
        '<div class="fact"><div class="k">주요 대상</div><div class="v">'+esc(b.target)+'</div></div>'+
        '<div class="fact"><div class="k">신청 시기</div><div class="v">'+esc(b.period.label)+
          (b.period.window?' · '+esc(b.period.window):'')+
          (b.period.note?'<br><span class="src">'+esc(b.period.note)+'</span>':'')+
          '<br>'+(b.period.verified?'<span class="chip c-ok">공고 확인</span>':'<span class="chip c-warn">출처 확인 중</span>')+
          (b.period.source?' <a href="'+esc(b.period.source)+'" target="_blank" rel="noopener noreferrer">출처 ↗</a>':'')+
        '</div></div>'+
        '<div class="fact"><div class="k">확인 기관</div><div class="v">'+esc(b.agency)+'</div></div>'+
      '</div>'+
      (b.deep? '<button type="button" class="btn btn-o btn-blk" style="margin-top:18px" onclick="App.deepDive()">내 지역 강좌와 자부담 보기</button>':'')+
      (b.url? '<p style="margin-top:12px"><a href="'+esc(b.url)+'" target="_blank" rel="noopener noreferrer">공식 신청처로 이동 ↗</a></p>'
            : '<p class="note" style="margin-top:12px">'+esc(b.agency)+'에서 확인하세요. 공식 신청 링크는 아직 확인되지 않았어요.</p>')+
      '<p class="src" style="margin-top:14px">기준일 '+TODAY+' · 참고용 안내예요. 정확한 자격은 '+esc(b.agency)+'에서 확인해주세요.</p>'+
    '</div></div>';
}

/* ---------- render (BUG-01: 포커스/커서 복원) ---------- */
function render(){
  var act=document.activeElement;
  var fk=(act&&act.dataset)?act.dataset.fk:null;
  var pos=null;
  try{ if(fk&&act.selectionStart!=null) pos=act.selectionStart; }catch(e){}

  var main;
  switch(state.route){
    case "quiz": main=quizHTML(); break;
    case "result": main=resultHTML(); break;
    case "courses": main=coursesHTML(); break;
    case "records": main=recordsHTML(); break;
    case "sources": main=sourcesHTML(); break;
    case "privacy": main=privacyHTML(); break;
    case "match": main=matchHTML(); break;
    default: main=homeHTML();
  }
  var html=header()+main+footer()+modalHTML();
  if(state.toast) html+='<div class="toast" role="status">'+esc(state.toast)+'</div>';
  document.getElementById("app").innerHTML=html;

  if(fk){
    var next=document.querySelector('[data-fk="'+fk+'"]');
    if(next){
      next.focus();
      try{ if(pos!=null&&next.setSelectionRange) next.setSelectionRange(pos,pos); }catch(e){}
    }
  }

  if(state.route==="courses" && state.f.mapMode){
    try{ syncMap(); }catch(e){ /* CHG-16: 지도 오류가 나머지 화면을 막지 않도록 방어 */
      var el=document.getElementById("courseMap");
      if(el) el.innerHTML='<div class="mapfallback"><p>지도를 불러오는 중 문제가 생겼어요.</p><p class="note">아래 목록으로 확인해주세요.</p></div>';
    }
  }
}

/* 카카오맵 인스턴스 동기화 — innerHTML 전체 재렌더 구조라 지도 모드일 때마다 새로 생성 (샘플 규모라 비용 낮음) */
function syncMap(){
  var el=document.getElementById("courseMap");
  if(!el) return;
  if(typeof kakao==="undefined" || !kakao.maps){
    el.innerHTML='<div class="mapfallback"><p><b>지도를 불러올 수 없어요.</b></p>'+
      '<p class="note">카카오맵 SDK 키 설정이 필요하거나, 지금 환경에서 외부 지도 서비스에 접속할 수 없어요.<br>아래 목록에서 강좌를 확인해주세요.</p></div>';
    return;
  }
  var v=courseView();
  var geoCourses=v.all.filter(function(c){ return c._geo; });
  var center = state.geo ? new kakao.maps.LatLng(state.geo.lat,state.geo.lng)
    : (geoCourses.length ? new kakao.maps.LatLng(geoCourses[0].lat,geoCourses[0].lng)
    : new kakao.maps.LatLng(37.5665,126.9780));
  var map=new kakao.maps.Map(el,{center:center, level:state.geo?6:8});

  if(state.geo){
    var meImg=new kakao.maps.MarkerImage(
      "data:image/svg+xml;base64,"+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"><circle cx="9" cy="9" r="7" fill="#1A73E8" stroke="#fff" stroke-width="2"/></svg>'),
      new kakao.maps.Size(18,18));
    new kakao.maps.Marker({position:center, map:map, image:meImg, zIndex:10});
    new kakao.maps.Circle({center:center, radius:state.f.radius, strokeWeight:1, strokeColor:"#1A73E8", strokeOpacity:0.6, strokeStyle:"shortdash", fillColor:"#1A73E8", fillOpacity:0.08, map:map});
  }

  var colorFor={ok:"#1E9E5A",left:"#1A73E8",pay:"#D64545",none:"#8A8F98"};
  var bounds = geoCourses.length ? new kakao.maps.LatLngBounds() : null;
  geoCourses.forEach(function(c){
    var hex=colorFor[c._verdict.k]||colorFor.none;
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="22" height="30"><path d="M11 0C4.9 0 0 4.9 0 11c0 8 11 19 11 19s11-11 11-19C22 4.9 17.1 0 11 0z" fill="'+hex+'" stroke="#fff" stroke-width="1.5"/><circle cx="11" cy="11" r="4" fill="#fff"/></svg>';
    var img=new kakao.maps.MarkerImage("data:image/svg+xml;base64,"+btoa(svg), new kakao.maps.Size(22,30), {offset:new kakao.maps.Point(11,30)});
    var pos=new kakao.maps.LatLng(c.lat,c.lng);
    var marker=new kakao.maps.Marker({position:pos, map:map, image:img, title:c.name});
    kakao.maps.event.addListener(marker,"click",function(){ App.openDetail(c.id); });
    kakao.maps.event.addListener(marker,"mouseover",function(){ App.hiCourse(c.id); });
    if(bounds) bounds.extend(pos);
  });
  if(!state.geo && bounds && geoCourses.length>1) map.setBounds(bounds);
}

document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if(state.modal){ App.closeModal(); }
    else if(state.filtersOpen){ App.toggleFilters(); }
    else if(state.detailId){ App.closeDetail(); }
  }
});

restore();
readQuery();
render();
})();
</script>
